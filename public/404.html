<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Page introuvable — Locavac</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f9f9f9;color:#222;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{font-size:28px;font-weight:700;color:#E8261A;margin-bottom:40px;text-decoration:none;display:inline-block}
.logo span{color:#222}
.emoji{font-size:80px;margin-bottom:24px;display:block}
h1{font-size:32px;font-weight:700;margin-bottom:12px}
p{font-size:16px;color:#555;line-height:1.6;max-width:400px;margin-bottom:32px}
.btn{display:inline-block;background:#E8261A;color:#fff;padding:14px 28px;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;transition:background .2s}
.btn:hover{background:#C0241A}
.hint{margin-top:20px;font-size:13px;color:#999}
</style>
</head>
<body>
  <a class="logo" href="/">Loca<span>vac</span></a>
  <span class="emoji">🏖️</span>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée. Revenez à l'accueil pour trouver votre prochain logement de vacances en Algérie.</p>
  <a class="btn" href="/">← Retour à l'accueil</a>
  <p class="hint">Erreur 404</p>
</body>
</html>
