# ────────────────────────────────────────────────────────────────
# Nginx — reverse proxy Locavac
# Hébergement : VPS France (OVH / Scaleway / Hetzner FR)
# Domaine     : locavac.dz (NIC.dz)
# Fichier à placer dans : /etc/nginx/sites-available/locavac
# Activer avec : sudo ln -s /etc/nginx/sites-available/locavac /etc/nginx/sites-enabled/
# Recharger    : sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS : sudo certbot --nginx -d locavac.dz -d www.locavac.dz
# ────────────────────────────────────────────────────────────────

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name locavac.dz www.locavac.dz;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Serveur principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name locavac.dz www.locavac.dz;

    # ── Certificats (gérés par certbot) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/locavac.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locavac.dz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ──────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none';"
      always;

    # ── Upload : limite 20 Mo (photos + docs identité) ───────────
    client_max_body_size 20M;

    # ── Reverse proxy vers Node.js ────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }

    # ── Fichiers uploadés (uploads/) ─────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA : toute autre route → index.html ─────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Logs ──────────────────────────────────────────────────────
    access_log /var/log/nginx/locavac.access.log;
    error_log  /var/log/nginx/locavac.error.log;
}
